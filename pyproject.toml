[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiforge"
version = "0.1.0"
description = "Vocabulary-budget risk harness for Gnani Prisma v3.0 on Hinglish banking speech"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lexiforge = "lexiforge.cli:app"

[tool.setuptools.packages.find]
include = ["lexiforge*"]

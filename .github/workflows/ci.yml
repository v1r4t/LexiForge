name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check lexiforge tests web scripts

      - name: Check committed data consistency
        run: |
          python scripts/check_data_consistency.py

      - name: Run tests
        run: |
          python -m pytest tests/ -q

  test-hashseed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        hashseed: ["0", "1"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with PYTHONHASHSEED=${{ matrix.hashseed }}
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
        run: |
          python -m pytest tests/ -q

  wheel-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install the wheel outside the source tree and import every module
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import importlib, pkgutil, lexiforge; mods = [m.name for m in pkgutil.walk_packages(lexiforge.__path__, 'lexiforge.')]; [importlib.import_module(m) for m in mods]; print(lexiforge.__file__, len(mods), 'modules')"

  build-web:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install and build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build
